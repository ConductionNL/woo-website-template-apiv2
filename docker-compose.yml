version: "3.4"

# Inline defaults (${VAR:-default}) zodat `docker compose up` werkt zonder lokale .env.
# Bron van de defaults is .env.example; maak voor afwijkende waarden een eigen .env
# (die wordt door Compose automatisch geladen en overschrijft deze defaults).
services:
  pwa: &pwa
    image: ${CONTAINER_REGISTRY_BASE:-ghcr.io/conductionnl}/${CONTAINER_PROJECT_NAME:-woo-website-v2}:${APP_BUILD:-dev}
    build:
      context: pwa
      args:
        GATSBY_ENV_VARS_SET: ${GATSBY_ENV_VARS_SET:-true}
        GATSBY_API_BASE_URL: ${GATSBY_API_BASE_URL:-/api}
        GATSBY_DEV_ENVIRONMENT: ${GATSBY_DEV_ENVIRONMENT:-false}
        GATSBY_NL_DESIGN_THEME_CLASSNAME: ${GATSBY_NL_DESIGN_THEME_CLASSNAME:-conduction-theme}
        GATSBY_CSP_CONNECT_SRC_FULL: ${GATSBY_CSP_CONNECT_SRC_FULL:-}
        GATSBY_CSP_CONNECT_SRC_EXTRA: ${GATSBY_CSP_CONNECT_SRC_EXTRA:-}
        GATSBY_SHOW_THEME_SWITCHER: ${GATSBY_SHOW_THEME_SWITCHER:-false}
        # Standaard favicon (data-URI) staat in .env.example; te lang om hier inline te zetten.
        GATSBY_FAVICON_URL: ${GATSBY_FAVICON_URL:-}
        GATSBY_ORGANISATION_NAME: ${GATSBY_ORGANISATION_NAME:-Conduction}
        GATSBY_JUMBOTRON_IMAGE_URL: ${GATSBY_JUMBOTRON_IMAGE_URL:-https://raw.githubusercontent.com/ConductionNL/woo-website-conduction/main/cropped-Conduction_HOME_0000_afb1-1.png}
        GATSBY_FOOTER_LOGO_URL: ${GATSBY_FOOTER_LOGO_URL:-https://conduction.nl}
        GATSBY_FOOTER_LOGO_HREF: ${GATSBY_FOOTER_LOGO_HREF:-https://conduction.nl/}
        GATSBY_FOOTER_HIDE_LOVE: ${GATSBY_FOOTER_HIDE_LOVE:-false}
        GATSBY_FOOTER_HIDE_LOGO: ${GATSBY_FOOTER_HIDE_LOGO:-false}
        GATSBY_FOOTER_CONTENT: ${GATSBY_FOOTER_CONTENT:-https://raw.githubusercontent.com/ConductionNL/woo-website-epe/main/FooterContent.json}
        GATSBY_FOOTER_CONTENT_HEADER: ${GATSBY_FOOTER_CONTENT_HEADER:-heading-4}
        GATSBY_OIDN_NUMBER: ${GATSBY_OIDN_NUMBER:-00000001809245206000}
        GATSBY_SHOW_CATEGORY: ${GATSBY_SHOW_CATEGORY:-}
        GATSBY_SHOW_ORGANIZATION: ${GATSBY_SHOW_ORGANIZATION:-}
        GATSBY_ANALYTICS_URL: ${GATSBY_ANALYTICS_URL:-}
        GATSBY_DATE_FULL_MONTH: ${GATSBY_DATE_FULL_MONTH:-false}
        GATSBY_SECURITY_TXT_INTRO: ${GATSBY_SECURITY_TXT_INTRO:-Information related to reporting security vulnerabilities of this site.}
        GATSBY_SECURITY_TXT_CONTACT: ${GATSBY_SECURITY_TXT_CONTACT:-mailto:info@conduction.nl}
        GATSBY_SECURITY_TXT_EXPIRES: ${GATSBY_SECURITY_TXT_EXPIRES:-2025-12-31T23:00:00.000Z}
        GATSBY_SECURITY_TXT_ENCRYPTION: ${GATSBY_SECURITY_TXT_ENCRYPTION:-}
        GATSBY_SECURITY_TXT_ACKNOWLEDGEMENTS: ${GATSBY_SECURITY_TXT_ACKNOWLEDGEMENTS:-}
        GATSBY_SECURITY_TXT_LANGUAGES: ${GATSBY_SECURITY_TXT_LANGUAGES:-nl, en}
        GATSBY_SECURITY_TXT_CANONICAL: ${GATSBY_SECURITY_TXT_CANONICAL:-}
        GATSBY_SECURITY_TXT_POLICY: ${GATSBY_SECURITY_TXT_POLICY:-}
        GATSBY_SECURITY_TXT_HIRING: ${GATSBY_SECURITY_TXT_HIRING:-}
    ports:
      - "8000:8080"
    environment:
      - UPSTREAM_HOST=${UPSTREAM_HOST:-zuiddrecht-drie.accept.commonground.nu}
      - UPSTREAM_BASE=${UPSTREAM_BASE:-https://zuiddrecht-drie.accept.commonground.nu/apps/opencatalogi/api}
volumes:
  db-data: {}
  uc-data: {}
  db-mysql: {}
