# Docker Image CI — Codeberg (Forgejo Actions)
#
# This is the ACTIVE CI pipeline and is written specifically for Codeberg and
# the talos runners.
#
# How we got here (so nobody retries dead ends):
#   - There is NO docker daemon or CLI anywhere on this infra: not on the
#     con-ci host class ("docker: command not found", observed 2026-07-07)
#     and not inside con-ci-oci container jobs.
#   - Rootless BuildKit was tried first but needs seccomp/apparmor
#     unconfined on the job container; the runner does NOT honor job-level
#     `container.options` (identical rootlesskit newuidmap failure with and
#     without them, observed 2026-07-07). See git history for that variant —
#     it becomes viable again if the runner config ever applies those
#     options for this class.
#   - kaniko builds Dockerfiles fully unprivileged — no daemon, no user
#     namespaces, no security-profile exceptions — so that is what this
#     pipeline uses, as a container job on con-ci-oci (the build class the
#     techbook designates for image build+push).
#
# kaniko is a BRIDGE (agreed with infra 2026-07-07, review date 2026-10-01):
# upstream was archived by Google 2025-06-03, frozen at v1.23.x, no security
# patches. Once the runners apply a targeted seccomp profile to job
# containers, the rootless-BuildKit variant in git history becomes viable
# and replaces it — expect that migration ask around the review date.
# The builder image comes from our own mirror (codeberg.org/conduction/
# kaniko, public package, no pull credentials needed), pinned by digest;
# gcr.io stays off the allowlist. Keep the -debug variant: container jobs
# need a shell (busybox sh) in the image.
#
# `docker compose` is no longer used in CI (docker-compose.yml remains the
# source of truth for local dev; the build step mirrors its pwa service:
# same context, image name and GATSBY_* build args from .env). The old
# compose smoke test (up -d, ps, logs) is gone: without a daemon there is
# nothing to `up`. As in preview.yaml there are NO `uses:` actions (no node
# on the runners): checkout is a tarball download and releases go through
# the Forgejo API. The GitHub Actions workflow at
# .github/workflows/dockerimage.yml is kept for reference/backup only.
#
# Egress (talos allowlist — all in place since 2026-07-07): codeberg.org
# (checkout, builder image, image push, release API), the docker.io registry
# endpoints incl. both CDNs (node:20/nginx base images) and
# registry.npmjs.org (npm install during the build). Any new host the build
# touches will 403 at the proxy — ask infra, it's a one-line reviewed change.
# NB the runner injects HTTP(S)_PROXY/NO_PROXY into the job and kaniko
# honors them for its own pulls/pushes, but RUN steps inside the build get
# the image-under-construction's env — the proxy is therefore passed through
# as predefined proxy build-args in the build step below.
name: Docker Image CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: con-ci-oci
    container:
      # Our mirror of gcr.io/kaniko-project/executor:v1.23.2-debug, pinned
      # by digest (verified identical to the upstream multi-arch index by
      # infra, 2026-07-07). The :debug variant ships a busybox shell (the
      # runner needs one to exec run steps); the plain executor image is
      # shell-less. Runs as root inside its own throwaway container,
      # unprivileged. No bash, so `shell: sh` on every step.
      image: codeberg.org/conduction/kaniko@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    steps:
      - name: Checkout (kaniko git clone — the executor is the only proxy-capable tool here)
        shell: sh
        env:
          # Used by the executor for the clone if the repo is not public.
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # busybox wget ignores proxy env vars for https URLs (verified
          # 2026-07-07), so a tarball download can never pass the egress
          # proxy. The executor IS proxy-aware (Go; sends CONNECT via the
          # injected HTTPS_PROXY — verified against a test proxy), and it
          # can clone git build contexts. Trick: point it at a nonexistent
          # dockerfile — it clones into /kaniko/buildcontext, then errors
          # out before building anything; the clone stays behind for the
          # build step. /kaniko is exempt from kaniko's filesystem
          # snapshotting, so the source also survives the real build.
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          PIN=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then PIN="#${GITHUB_SHA}"; fi
          /kaniko/executor \
            --context "git://codeberg.org/${GITHUB_REPOSITORY}.git#refs/heads/${REF}${PIN}" \
            --dockerfile .kaniko-clone-only --no-push || true
          # The expected error above is only about the dockerfile; verify
          # the clone itself is complete or fail the job here.
          test -f /kaniko/buildcontext/.env
          test -f /kaniko/buildcontext/pwa/Dockerfile

      - name: Build the image (and push on branch pushes)
        shell: sh
        env:
          # Push auth REQUIRES the REGISTRY_TOKEN secret: a Codeberg access
          # token with scope write:package only, owned by an org member (or
          # machine account) with package write. The automatic Actions token
          # carries NO package write on Forgejo v15 (platform fact; upstream
          # rejected granting it, forgejo PR #6538) — no fallback to it.
          # The registry requires the login username to match the token's
          # owner, so set the REGISTRY_USER secret to that account name; it
          # falls back to the pushing user for the personal-token case.
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # Source was cloned here by the checkout step.
          cd /kaniko/buildcontext

          # Image name: codeberg.org/<owner>/<project>:<tag>, mirroring the
          # compose file (CONTAINER_PROJECT_NAME comes from .env). Tag:
          # main -> latest, development -> development; PR builds tag after
          # their base branch but are never pushed.
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          PROJECT=$(grep '^CONTAINER_PROJECT_NAME=' .env | cut -d '=' -f2)
          REF="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          case "$REF" in
            *main*) TAG=latest ;;
            *)      TAG=development ;;
          esac
          IMAGE="codeberg.org/${OWNER}/${PROJECT}:${TAG}"

          PUSH=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ -z "${REGISTRY_TOKEN}" ]; then
              echo "REGISTRY_TOKEN secret is missing (Codeberg access token, scope write:package)." >&2
              echo "The automatic Actions token cannot push packages on Forgejo v15 — see workflow header." >&2
              exit 1
            fi
            PUSH=true
            # kaniko reads registry auth from /kaniko/.docker/config.json;
            # the credential is written there, never onto a command line.
            mkdir -p /kaniko/.docker
            AUTH=$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_TOKEN}" | base64 | tr -d '\n')
            printf '{"auths":{"codeberg.org":{"auth":"%s"}}}\n' "$AUTH" > /kaniko/.docker/config.json
          fi
          echo "Building ${IMAGE} (push=${PUSH})"

          # GATSBY_* build args from .env, parsed line-based exactly like
          # compose does (the file cannot be sourced: some values contain
          # unquoted spaces) with surrounding quotes stripped. Args the
          # Dockerfile does not declare only produce a warning.
          set --
          while IFS= read -r line; do
            case "$line" in
              GATSBY_*=*)
                k=${line%%=*}
                v=${line#*=}
                case "$v" in
                  \"*\") v=${v#\"}; v=${v%\"} ;;
                  \'*\') v=${v#\'}; v=${v%\'} ;;
                esac
                set -- "$@" --build-arg "${k}=${v}"
                ;;
            esac
          done < .env
          # RUN steps (npm install) execute with the image-under-construction's
          # env, not the job's, so the runner-injected proxy settings must be
          # handed in as build args. HTTP_PROXY/HTTPS_PROXY/NO_PROXY are
          # docker-predefined args: no ARG lines needed in the Dockerfile and
          # they do not end up in the image config.
          set -- "$@" \
            --build-arg "HTTP_PROXY=${HTTP_PROXY:-}" \
            --build-arg "HTTPS_PROXY=${HTTPS_PROXY:-}" \
            --build-arg "NO_PROXY=${NO_PROXY:-}"

          if [ "$PUSH" != "true" ]; then
            set -- "$@" --no-push
          fi

          # Docker Hub pulls normally go via index.docker.io, which is NOT
          # on the egress allowlist ("Forbidden", observed 2026-07-08);
          # registry-1.docker.io IS. Map hub pulls onto it — same registry
          # backend, allowlisted host (verified locally: "retrieving image
          # from mapped registry").
          /kaniko/executor \
            --context "dir://$(pwd)/pwa" \
            --dockerfile Dockerfile \
            --destination "${IMAGE}" \
            --registry-mirror registry-1.docker.io \
            "$@"

  # Releases via the Forgejo REST API (creates tag + release in one call).
  # The old actions/forgejo-release is a node action and cannot run on these
  # runners, so this runs curl in a small pinned container. Runs even when
  # the build failed, matching the old `continue-on-error: true` +
  # `success() || failure()` behaviour; a 409 (release already exists) does
  # not fail the job either.
  release:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: con-ci-oci
    container:
      image: docker.io/curlimages/curl:8.14.1
    steps:
      - name: Create release (main) or pre-release (development)
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            main)        SUFFIX="";             PRERELEASE=false ;;
            development) SUFFIX="-development"; PRERELEASE=true ;;
            *) echo "No release for branch ${GITHUB_REF_NAME}"; exit 0 ;;
          esac
          # Release name 0.1.YearMonthDay (UTC), read from .env at the built
          # commit — no checkout needed in this job.
          VERSION=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/raw/.env?ref=${GITHUB_SHA}" \
            | grep '^APP_VERSION=' | cut -d '=' -f2)
          RELEASE_TAG="${VERSION}.$(date -u +%y%m%d)${SUFFIX}"
          echo "Creating release ${RELEASE_TAG}"
          curl -fsS -X POST \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"prerelease\":${PRERELEASE}}" \
            || echo "Release ${RELEASE_TAG} not created (it may already exist)"
