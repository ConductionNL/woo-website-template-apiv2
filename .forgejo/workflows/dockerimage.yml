# Docker Image CI — Codeberg (Forgejo Actions)
#
# This is the ACTIVE CI pipeline and is written specifically for Codeberg and
# the talos runners.
#
# How we got here (so nobody retries dead ends):
#   - There is NO docker daemon or CLI anywhere on this infra: not on the
#     con-ci host class ("docker: command not found", observed 2026-07-07)
#     and not inside con-ci-oci container jobs.
#   - Rootless BuildKit was tried first but needs seccomp/apparmor
#     unconfined on the job container; the runner does NOT honor job-level
#     `container.options` (identical rootlesskit newuidmap failure with and
#     without them, observed 2026-07-07). See git history for that variant —
#     it becomes viable again if the runner config ever applies those
#     options for this class.
#   - kaniko builds Dockerfiles fully unprivileged — no daemon, no user
#     namespaces, no security-profile exceptions — so that is what this
#     pipeline uses, as a container job on con-ci-oci (the build class the
#     techbook designates for image build+push).
#
# kaniko caveats: the project was archived by Google in 2025, so the pin
# stays on the final release (v1.23.2). If gcr.io is not pullable by the
# runner, mirror the image once to the Codeberg registry
# (docker pull gcr.io/kaniko-project/executor:v1.23.2-debug &&
#  docker tag ... codeberg.org/conduction/kaniko:v1.23.2-debug &&
#  docker push ...) and point `image:` below at the mirror.
#
# `docker compose` is no longer used in CI (docker-compose.yml remains the
# source of truth for local dev; the build step mirrors its pwa service:
# same context, image name and GATSBY_* build args from .env). The old
# compose smoke test (up -d, ps, logs) is gone: without a daemon there is
# nothing to `up`. As in preview.yaml there are NO `uses:` actions (no node
# on the runners): checkout is a tarball download and releases go through
# the Forgejo API. The GitHub Actions workflow at
# .github/workflows/dockerimage.yml is kept for reference/backup only.
#
# Egress (talos allowlist) — the JOB itself needs:
#   - docker.io registry endpoints (registry-1.docker.io, auth.docker.io and
#     the download CDN): kaniko pulls the node:20 and nginx base images;
#   - registry.npmjs.org: `npm install` runs as a process in this job during
#     the image build (same procedure as pypi.org for the handbook, talos
#     commit 2026-07-06);
#   - codeberg.org: checkout, image push and the release API.
name: Docker Image CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: con-ci-oci
    container:
      # The :debug variant ships a busybox shell (the runner needs one to
      # exec run steps); the plain executor image is shell-less. Runs as
      # root inside its own throwaway container, unprivileged. No bash, so
      # `shell: sh` on every step.
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    steps:
      - name: Checkout (tarball — no git or node in this image)
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Source goes into the default working directory: it is a mounted
          # volume, which kaniko leaves alone when it wipes the container
          # filesystem between build stages. Fallback ref for PR events
          # whose merge SHA has no archive.
          wget --header "Authorization: token ${GITHUB_TOKEN}" -O src.tar.gz \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            || wget --header "Authorization: token ${GITHUB_TOKEN}" -O src.tar.gz \
              "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/archive/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}.tar.gz"
          tar -xzf src.tar.gz

      - name: Build the image (and push on branch pushes)
        shell: sh
        env:
          # Registry credentials: a REGISTRY_TOKEN secret (Codeberg token
          # with package:write) is preferred; the automatic Actions token is
          # the fallback and works if it carries package scope.
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # The archive extracts into a directory named after the repo.
          cd "${GITHUB_REPOSITORY#*/}"

          # Image name: codeberg.org/<owner>/<project>:<tag>, mirroring the
          # compose file (CONTAINER_PROJECT_NAME comes from .env). Tag:
          # main -> latest, development -> development; PR builds tag after
          # their base branch but are never pushed.
          OWNER=$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr 'A-Z' 'a-z')
          PROJECT=$(grep '^CONTAINER_PROJECT_NAME=' .env | cut -d '=' -f2)
          REF="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
          case "$REF" in
            *main*) TAG=latest ;;
            *)      TAG=development ;;
          esac
          IMAGE="codeberg.org/${OWNER}/${PROJECT}:${TAG}"

          PUSH=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${REGISTRY_TOKEN}" ]; then
            PUSH=true
            # kaniko reads registry auth from /kaniko/.docker/config.json;
            # the credential is written there, never onto a command line.
            mkdir -p /kaniko/.docker
            AUTH=$(printf '%s:%s' "${REGISTRY_USER}" "${REGISTRY_TOKEN}" | base64 | tr -d '\n')
            printf '{"auths":{"codeberg.org":{"auth":"%s"}}}\n' "$AUTH" > /kaniko/.docker/config.json
          fi
          echo "Building ${IMAGE} (push=${PUSH})"

          # GATSBY_* build args from .env, parsed line-based exactly like
          # compose does (the file cannot be sourced: some values contain
          # unquoted spaces) with surrounding quotes stripped. Args the
          # Dockerfile does not declare only produce a warning.
          set --
          while IFS= read -r line; do
            case "$line" in
              GATSBY_*=*)
                k=${line%%=*}
                v=${line#*=}
                case "$v" in
                  \"*\") v=${v#\"}; v=${v%\"} ;;
                  \'*\') v=${v#\'}; v=${v%\'} ;;
                esac
                set -- "$@" --build-arg "${k}=${v}"
                ;;
            esac
          done < .env
          if [ "$PUSH" != "true" ]; then
            set -- "$@" --no-push
          fi

          /kaniko/executor \
            --context "dir://$(pwd)/pwa" \
            --dockerfile Dockerfile \
            --destination "${IMAGE}" \
            "$@"

  # Releases via the Forgejo REST API (creates tag + release in one call).
  # The old actions/forgejo-release is a node action and cannot run on these
  # runners, so this runs curl in a small pinned container. Runs even when
  # the build failed, matching the old `continue-on-error: true` +
  # `success() || failure()` behaviour; a 409 (release already exists) does
  # not fail the job either.
  release:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: con-ci-oci
    container:
      image: docker.io/curlimages/curl:8.14.1
    steps:
      - name: Create release (main) or pre-release (development)
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            main)        SUFFIX="";             PRERELEASE=false ;;
            development) SUFFIX="-development"; PRERELEASE=true ;;
            *) echo "No release for branch ${GITHUB_REF_NAME}"; exit 0 ;;
          esac
          # Release name 0.1.YearMonthDay (UTC), read from .env at the built
          # commit — no checkout needed in this job.
          VERSION=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/raw/.env?ref=${GITHUB_SHA}" \
            | grep '^APP_VERSION=' | cut -d '=' -f2)
          RELEASE_TAG="${VERSION}.$(date -u +%y%m%d)${SUFFIX}"
          echo "Creating release ${RELEASE_TAG}"
          curl -fsS -X POST \
            "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"prerelease\":${PRERELEASE}}" \
            || echo "Release ${RELEASE_TAG} not created (it may already exist)"
