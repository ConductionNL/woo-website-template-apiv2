# Docker Image CI — Codeberg (Forgejo Actions)
#
# This is the ACTIVE CI pipeline and is written specifically for Codeberg.
#
# Runner-class choice (talos house rules): this job needs the host docker
# daemon (docker compose build/up/push) → host class `con-ci`, NOT the
# container class `con-ci-oci` used by the handbook/preview pipeline.
#
# The con-ci host runner has no node and no curl (same constraints as
# documented in .forgejo/workflows/preview.yaml). Therefore this workflow
# uses NO `uses:` actions at all:
#   - checkout is a manual `git init + fetch` (actions/checkout needs node);
#   - releases are created via the Forgejo REST API, with curl running in a
#     container (actions/forgejo-release needs node; the host has no curl,
#     but it always has docker).
#
# Images are built with docker compose and pushed to Codeberg's built-in
# container registry at codeberg.org/<owner>/<project>.
#
# The GitHub Actions workflow at .github/workflows/dockerimage.yml is kept for
# reference/backup only and has its automatic triggers disabled.
#
# Egress: the con-ci allowlist must contain codeberg.org and docker.io
# (both already present, see talos notes in preview.yaml).
name: Docker Image CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: con-ci
    steps:
      - name: Checkout (manual — no node on these runners)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # init + fetch instead of `git clone --branch` so pull_request refs
          # (refs/pull/N/merge) work too, not just branch pushes.
          git init .
          git remote add origin "https://codeberg.org/${GITHUB_REPOSITORY}.git"
          # Auth via env-scoped git config so the token never appears in
          # URLs, logs or the process list (and nothing is written to the
          # host's ~/.git-credentials, unlike the container job in
          # preview.yaml).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf '%s:%s' "${GITHUB_ACTOR}" "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          # Fallbacks: merge ref may not exist → try the PR head ref, then a
          # plain branch name (push events).
          git fetch --depth 1 origin "${GITHUB_REF}" \
            || git fetch --depth 1 origin "${GITHUB_REF%merge}head" \
            || git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout --force FETCH_HEAD

      - name: Export release code
        if: (success() || failure())
        id: releasecode #version number in a more comprehensible format: 0.1.YearMonthDay in UTC
        run: |
          export VERSION=$(grep APP_VERSION= .env | cut -d '=' -f2)
          export RELEASE=$VERSION.$(date --utc +%y%m%d)
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "releasename=$RELEASE" >> $GITHUB_OUTPUT
      - name: Setting APP_NAME
        run: |
          export NAME=$(grep APP_NAME= .env | cut -d '=' -f2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV
      - name: Print app name
        run: echo "APP_NAME = $APP_NAME"

      # Publish to Codeberg's container registry instead of ghcr.io.
      # This overrides CONTAINER_REGISTRY_BASE from .env; docker compose gives
      # precedence to shell env vars over the .env file, so the image becomes
      # codeberg.org/<owner>/${CONTAINER_PROJECT_NAME}.
      - name: Setting container registry (Codeberg)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "CONTAINER_REGISTRY_BASE=codeberg.org/$OWNER" >> $GITHUB_ENV

      - name: Setting APP_ENV for main
        if: contains( github.ref, 'main' ) || contains( github.base_ref, 'main' )
        run: |
          echo "APP_ENV=latest" >> $GITHUB_ENV
          echo "APP_BUILD=latest" >> $GITHUB_ENV
      - name: Setting APP_ENV for development
        if: contains( github.ref, 'development' ) || contains( github.base_ref, 'development' )
        run: |
          echo "APP_ENV=development" >> $GITHUB_ENV
          echo "APP_BUILD=development" >> $GITHUB_ENV

      - name: Print definitive APP_ENV
        run: echo "APP_ENV is now $APP_ENV, APP_BUILD is now $APP_BUILD, registry is $CONTAINER_REGISTRY_BASE"
      - name: Build the Docker image
        run: docker compose build --build-arg APP_ENV=$APP_ENV --build-arg APP_BUILD=$APP_BUILD --build-arg APP_BUILD_ALL_FIXTURES=true
      - name: Run the docker image
        run: docker compose up -d
      - name: Taking some sleep (for containers to come up)
        run: sleep 20
      - name: Check if all containers are running
        run: docker ps
      - name: Dumping the logs
        run: docker compose logs
      - name: Show all images
        run: docker images

      # Log in to the Codeberg container registry. By default this uses the
      # automatically provided Forgejo Actions token (no extra secret required).
      # If your Codeberg instance's automatic token lacks package:write scope,
      # add a REGISTRY_TOKEN secret (a Codeberg token with package write) and it
      # will be preferred automatically.
      # The credential is passed via env rather than interpolated into the shell
      # so it stays out of the command line, and login failures fail loudly.
      - name: Login to Codeberg Container Registry
        id: containerregistry-login
        env:
          REGISTRY_HOST: codeberg.org
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "No registry token available; skipping login and push."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          echo "success=true" >> "$GITHUB_OUTPUT"

      - if: steps.containerregistry-login.outputs.success == 'true' && github.ref == 'refs/heads/main'
        name: Push to Container Registry (main → latest)
        run: docker compose push
      - if: steps.containerregistry-login.outputs.success == 'true' && github.ref == 'refs/heads/development'
        name: Push to Container Registry (development → development)
        run: docker compose push

      - name: Print release name
        if: (success() || failure())
        run: echo $RELEASENAME
        env:
          RELEASENAME: ${{ steps.releasecode.outputs.releasename }}

      # Releases via the Forgejo REST API (creates the tag + release in one
      # call). The old actions/forgejo-release action is a node action and
      # cannot run on these runners; curl is missing on the host, so it runs
      # in a pinned container image. All values are passed as env vars so the
      # token never hits the command line. Failures (e.g. 409 when the
      # release already exists) do not fail the build, matching the old
      # `continue-on-error: true`.
      - name: Create Release (main)
        if: github.ref == 'refs/heads/main' && ( success() || failure() )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.releasecode.outputs.releasename }}
          RELEASE_PRERELEASE: "false"
        run: |
          docker run --rm \
            -e GITHUB_TOKEN -e RELEASE_TAG -e RELEASE_PRERELEASE \
            -e GITHUB_REPOSITORY -e GITHUB_SHA \
            --entrypoint /bin/sh docker.io/curlimages/curl:8.14.1 -c '
              curl -fsS -X POST \
                "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"prerelease\":${RELEASE_PRERELEASE}}"
            ' || echo "Release ${RELEASE_TAG} not created (it may already exist)"
      - name: Create Pre-Release (development)
        if: github.ref == 'refs/heads/development' && ( success() || failure() )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.releasecode.outputs.releasename }}-development
          RELEASE_PRERELEASE: "true"
        run: |
          docker run --rm \
            -e GITHUB_TOKEN -e RELEASE_TAG -e RELEASE_PRERELEASE \
            -e GITHUB_REPOSITORY -e GITHUB_SHA \
            --entrypoint /bin/sh docker.io/curlimages/curl:8.14.1 -c '
              curl -fsS -X POST \
                "https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"target_commitish\":\"${GITHUB_SHA}\",\"prerelease\":${RELEASE_PRERELEASE}}"
            ' || echo "Release ${RELEASE_TAG} not created (it may already exist)"

      - name: Chores
        if: (success() || failure())
        run: docker compose down
