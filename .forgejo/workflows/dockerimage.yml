# Docker Image CI — Codeberg (Forgejo Actions)
#
# This is the ACTIVE CI pipeline and is written specifically for Codeberg.
#
# - `runs-on: con-ci` targets our own self-hosted runners (registered with the
#   `con-ci` label).
# - Images are built with docker compose and pushed to Codeberg's built-in
#   container registry at codeberg.org/<owner>/<project>.
# - Releases are cut with the Forgejo-native `actions/forgejo-release` action
#   (the GitHub-only release actions from the old workflow do not exist on
#   Codeberg).
#
# The GitHub Actions workflow at .github/workflows/dockerimage.yml is kept for
# reference/backup only and has its automatic triggers disabled.
#
# NOTE: the con-ci runner must be able to reach the Forgejo actions host
# (data.forgejo.org / code.forgejo.org) and the docker registries through its
# egress proxy, otherwise the `uses:` actions cannot be downloaded.
name: Docker Image CI

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: con-ci
    steps:
      - uses: actions/checkout@v4

      - name: Export release code
        if: (success() || failure())
        id: releasecode #version number in a more comprehensible format: 0.1.YearMonthDay in UTC
        run: |
          export VERSION=$(grep APP_VERSION= .env | cut -d '=' -f2)
          export RELEASE=$VERSION.$(date --utc +%y%m%d)
          echo "RELEASE=$RELEASE" >> $GITHUB_ENV
          echo "releasename=$RELEASE" >> $GITHUB_OUTPUT
      - name: Setting APP_NAME
        run: |
          export NAME=$(grep APP_NAME= .env | cut -d '=' -f2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV
      - name: Print app name
        run: echo "APP_NAME = $APP_NAME"

      # Publish to Codeberg's container registry instead of ghcr.io.
      # This overrides CONTAINER_REGISTRY_BASE from .env; docker compose gives
      # precedence to shell env vars over the .env file, so the image becomes
      # codeberg.org/<owner>/${CONTAINER_PROJECT_NAME}.
      - name: Setting container registry (Codeberg)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "CONTAINER_REGISTRY_BASE=codeberg.org/$OWNER" >> $GITHUB_ENV

      - name: Setting APP_ENV for main
        if: contains( github.ref, 'main' ) || contains( github.base_ref, 'main' )
        run: |
          echo "APP_ENV=latest" >> $GITHUB_ENV
          echo "APP_BUILD=latest" >> $GITHUB_ENV
      - name: Setting APP_ENV for development
        if: contains( github.ref, 'development' ) || contains( github.base_ref, 'development' )
        run: |
          echo "APP_ENV=development" >> $GITHUB_ENV
          echo "APP_BUILD=development" >> $GITHUB_ENV

      - name: Print definitive APP_ENV
        run: echo "APP_ENV is now $APP_ENV, APP_BUILD is now $APP_BUILD, registry is $CONTAINER_REGISTRY_BASE"
      - name: Build the Docker image
        run: docker compose build --build-arg APP_ENV=$APP_ENV --build-arg APP_BUILD=$APP_BUILD --build-arg APP_BUILD_ALL_FIXTURES=true
      - name: Run the docker image
        run: docker compose up -d
      - name: Taking some sleep (for containers to come up)
        run: sleep 20
      - name: Check if all containers are running
        run: docker ps
      - name: Dumping the logs
        run: docker compose logs
      - name: Show all images
        run: docker images

      # Log in to the Codeberg container registry. By default this uses the
      # automatically provided Forgejo Actions token (no extra secret required).
      # If your Codeberg instance's automatic token lacks package:write scope,
      # add a REGISTRY_TOKEN secret (a Codeberg token with package write) and it
      # will be preferred automatically.
      # The credential is passed via env rather than interpolated into the shell
      # so it stays out of the command line, and login failures fail loudly.
      - name: Login to Codeberg Container Registry
        id: containerregistry-login
        env:
          REGISTRY_HOST: codeberg.org
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "No registry token available; skipping login and push."
            echo "success=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          echo "success=true" >> "$GITHUB_OUTPUT"

      - if: steps.containerregistry-login.outputs.success == 'true' && github.ref == 'refs/heads/main'
        name: Push to Container Registry (main → latest)
        run: docker compose push
      - if: steps.containerregistry-login.outputs.success == 'true' && github.ref == 'refs/heads/development'
        name: Push to Container Registry (development → development)
        run: docker compose push

      - name: Print release name
        if: (success() || failure())
        run: echo $RELEASENAME
        env:
          RELEASENAME: ${{ steps.releasecode.outputs.releasename }}

      # forgejo-release uploads assets to a Forgejo release (creating the tag
      # and release if needed). We have no build artifacts to attach, so we just
      # ensure an empty directory exists to satisfy the action.
      - name: Prepare release assets directory
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') && ( success() || failure() )
        run: mkdir -p release

      - name: Create Release (main)
        if: github.ref == 'refs/heads/main' && ( success() || failure() )
        id: create_release
        uses: actions/forgejo-release@v2.13.1
        continue-on-error: true
        with:
          direction: upload
          release-dir: release
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.releasecode.outputs.releasename }}
          title: ${{ steps.releasecode.outputs.releasename }}
          prerelease: false
      - name: Create Pre-Release (development)
        if: github.ref == 'refs/heads/development' && ( success() || failure() )
        id: create_prerelease
        uses: actions/forgejo-release@v2.13.1
        continue-on-error: true
        with:
          direction: upload
          release-dir: release
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.releasecode.outputs.releasename }}-development
          title: ${{ steps.releasecode.outputs.releasename }}-development
          prerelease: true

      - name: Chores
        if: (success() || failure())
        run: docker compose down
